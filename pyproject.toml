[project]
name = "markutils"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5",
    "safetensors>=0.4",
]

[project.scripts]
markutils = "markutils:cli.main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipython",
    "pyarrow>=10",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
